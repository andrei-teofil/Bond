<html>
    <head>
        <title>Bond</title>
        <link rel="stylesheet" href="example.css">
    </head>

    <body>
        <div style="width:300px; background:rgb(255, 103, 222);">
            <div style="width:50%; background: rgb(163, 255, 163);">
                50% of parent's width
            </div>

            <div style="width: 50vw; height: 50vh; background: blue;">
                50% of view's width/height (browser screen's width)
            </div>

            <div style="padding: 10px; background: cyan;">
                padded box
            </div>
            <span style="padding: 0 5 10 20; background: red;">
                padded box (top,right,bottom,left)
            </span>

            <br/><br/>

            <span style="padding: 10 5; background: rgb(1, 245, 17);">
                padded box (vertical, horizontal)
            </span>

            <div style="margin-top: 20px; 
                margin-left: 10; background: rgb(232, 255, 148);"
            >
                10px to the left, 20 top
            </div>
            <!-- same options as padding -->
        </div>
    </body>
</html>
